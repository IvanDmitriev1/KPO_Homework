services:
  docker-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    environment:
      ASPIRE_DASHBOARD_FORWARDEDHEADERS_ENABLED: "true"
    ports:
      - "18888:18888"
    expose:
      - "18889"
    networks:
      - "my-network"
    restart: "always"
  minio:
    image: "docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z"
    command:
      - "server"
      - "/data"
      - "--console-address"
      - ":9001"
    environment:
      MINIO_ROOT_USER: "${USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOTPASSWORD}"
    expose:
      - "9000"
      - "9001"
    volumes:
      - type: "volume"
        target: "/data"
        source: "kpo_hw3.apphost-97a6d9a798-minio-data"
        read_only: false
    networks:
      - "my-network"
  db:
    image: "docker.io/library/postgres:17.6"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    expose:
      - "5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql/data"
        source: "kpo_hw3.apphost-97a6d9a798-db-data"
        read_only: false
    networks:
      - "my-network"
  file-storage:
    image: "${FILE_STORAGE_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${FILE_STORAGE_PORT}"
      ConnectionStrings__file-storage-db: "Host=db;Port=5432;Username=postgres;Password=${DB_PASSWORD};Database=file-storage-db"
      FILE-STORAGE-DB_HOST: "db"
      FILE-STORAGE-DB_PORT: "5432"
      FILE-STORAGE-DB_USERNAME: "postgres"
      FILE-STORAGE-DB_PASSWORD: "${DB_PASSWORD}"
      FILE-STORAGE-DB_URI: "postgresql://postgres:${DB_PASSWORD}@db:5432/file-storage-db"
      FILE-STORAGE-DB_JDBCCONNECTIONSTRING: "jdbc:postgresql://db:5432/file-storage-db"
      FILE-STORAGE-DB_DATABASE: "file-storage-db"
      ConnectionStrings__minio: "Endpoint=http://minio:9000;AccessKey=${USER};SecretKey=${MINIO_ROOTPASSWORD}"
      MINIO_HOST: "minio"
      MINIO_PORT: "9000"
      MINIO_ACCESSKEY: "${USER}"
      MINIO_SECRETKEY: "${MINIO_ROOTPASSWORD}"
      MINIO_URI: "http://minio:9000"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://docker-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "file-storage"
    expose:
      - "${FILE_STORAGE_PORT}"
    depends_on:
      db:
        condition: "service_started"
      minio:
        condition: "service_started"
    networks:
      - "my-network"
  file-analysis:
    image: "${FILE_ANALYSIS_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${FILE_ANALYSIS_PORT}"
      ConnectionStrings__file-analysis-db: "Host=db;Port=5432;Username=postgres;Password=${DB_PASSWORD};Database=file-analysis-db"
      FILE-ANALYSIS-DB_HOST: "db"
      FILE-ANALYSIS-DB_PORT: "5432"
      FILE-ANALYSIS-DB_USERNAME: "postgres"
      FILE-ANALYSIS-DB_PASSWORD: "${DB_PASSWORD}"
      FILE-ANALYSIS-DB_URI: "postgresql://postgres:${DB_PASSWORD}@db:5432/file-analysis-db"
      FILE-ANALYSIS-DB_JDBCCONNECTIONSTRING: "jdbc:postgresql://db:5432/file-analysis-db"
      FILE-ANALYSIS-DB_DATABASE: "file-analysis-db"
      FILE-STORAGE_HTTP: "http://file-storage:${FILE_STORAGE_PORT}"
      services__file-storage__http__0: "http://file-storage:${FILE_STORAGE_PORT}"
      FILE-STORAGE_HTTPS: "https://file-storage:${FILE_STORAGE_PORT}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://docker-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "file-analysis"
    expose:
      - "${FILE_ANALYSIS_PORT}"
    depends_on:
      db:
        condition: "service_started"
      file-storage:
        condition: "service_started"
    networks:
      - "my-network"
  api:
    image: "${API_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${API_PORT}"
      FILE-STORAGE_HTTP: "http://file-storage:${FILE_STORAGE_PORT}"
      services__file-storage__http__0: "http://file-storage:${FILE_STORAGE_PORT}"
      FILE-STORAGE_HTTPS: "https://file-storage:${FILE_STORAGE_PORT}"
      FILE-ANALYSIS_HTTP: "http://file-analysis:${FILE_ANALYSIS_PORT}"
      services__file-analysis__http__0: "http://file-analysis:${FILE_ANALYSIS_PORT}"
      FILE-ANALYSIS_HTTPS: "https://file-analysis:${FILE_ANALYSIS_PORT}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://docker-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "api"
    ports:
      - "8080:8080"
    expose:
      - "${API_PORT}"
    depends_on:
      file-analysis:
        condition: "service_started"
    networks:
      - "my-network"
networks:
  my-network:
    driver: "bridge"
volumes:
  kpo_hw3.apphost-97a6d9a798-minio-data:
    driver: "local"
  kpo_hw3.apphost-97a6d9a798-db-data:
    driver: "local"
